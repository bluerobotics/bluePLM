name: Build and Release

on:
  push:
    tags:
      - 'v*'

# Read by default; the two jobs that genuinely publish something widen it for themselves.
permissions:
  contents: read

# `scripts/release.js` deletes and re-pushes an existing tag, so the same ref can start this
# workflow twice. Serialize rather than cancel: a cancelled run can leave artifacts uploaded and a
# GitHub release half-created, which is worse than waiting for the first one to finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate that did not exist. Before this, a tag produced installers without a single test,
  # typecheck or API build having run against it — ci.yml has no `tags:` trigger, so nothing in the
  # release path checked anything. This is the same job definition ci.yml runs on pull requests,
  # not a copy of it; see verify.yml.
  verify:
    uses: ./.github/workflows/verify.yml
    secrets:
      SOLIDWORKS_DM_LICENSE_KEY: ${{ secrets.SOLIDWORKS_DM_LICENSE_KEY }}
      CI_ASSETS_TOKEN: ${{ secrets.CI_ASSETS_TOKEN }}

  # A tag is the only input to this workflow and two things can silently disagree with it, both
  # cheap to check here and expensive to discover afterwards.
  #
  # electron-builder takes the version from package.json rather than from the tag, so tagging
  # v3.25.0 while package.json says 3.24.0 emits BluePLM-3.24.0-win.exe and a latest.yml announcing
  # 3.24.0 — existing installs never see the release and auto-update never offers it. The release
  # would still go green.
  #
  # The release body is extracted from CHANGELOG.md by exact heading match, so a tag whose section
  # is missing or empty publishes a release with no notes.
  check-release-metadata:
    name: Check version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Tag must match package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}." \
                 "electron-builder reads package.json, so this tag would publish installers named" \
                 "${PKG_VERSION} and a latest.yml that existing installs ignore." \
                 "Bump package.json to ${TAG_VERSION} and re-tag."
            exit 1
          fi
          echo "Tag and package.json agree on ${PKG_VERSION}."

      # Prereleases are exempt because they have never had their own changelog section — every
      # `-beta.N` tag in this repository extracts empty today, and failing them here would break a
      # working path to fix one that is not used by them.
      - name: Changelog section must exist for a stable release
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          SECTION=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          if [ -n "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            echo "Found a non-empty '## [${VERSION}]' section in CHANGELOG.md (${#SECTION} characters)."
            # Reported here rather than only in the release job, which runs after the installers are
            # built. The release job truncates and links the file; this is so the operator knows it
            # is going to before waiting for the build.
            if [ "${#SECTION}" -gt 120000 ]; then
              echo "::warning::That section is longer than GitHub's 125,000-character release body" \
                   "limit, so the published notes will be truncated with a link to CHANGELOG.md."
            fi
            exit 0
          fi
          case "$VERSION" in
            *-*)
              echo "::warning::No '## [${VERSION}]' section in CHANGELOG.md." \
                   "Prerelease, so the release body will be empty — this is the existing behaviour."
              ;;
            *)
              echo "::error::CHANGELOG.md has no non-empty '## [${VERSION}]' section." \
                   "This tag would publish a release with no notes. Add the section and re-tag."
              exit 1
              ;;
          esac

  build-windows:
    needs: [verify, check-release-metadata]
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Download restic binary
        run: npm run download-restic -- --current

      - name: Build Electron app
        run: npm run build -- --publish never
        env:
          BLUEPLM_EDRAWINGS_RELEASE_BUILD: '1'

      - name: Verify eDrawings preview payload is present
        run: node scripts/verify-edrawings-preview-artifacts.js

      # electron-builder skips an extraResources entry whose `from` directory is missing rather
      # than failing. Verify after the build that its expected service binary exists.
      - name: Verify SolidWorks service binary is present
        run: |
          $exe = 'resources/bin/win32/BluePLM.SolidWorksService.exe'
          if (-not (Test-Path $exe)) {
            throw "Missing $exe - the installer would ship without SOLIDWORKS integration."
          }
          Write-Host "Found $exe ($((Get-Item $exe).Length) bytes)"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-build
          path: |
            release/*.exe
            release/latest*.yml
            release/beta*.yml
            release/alpha*.yml
          if-no-files-found: error

  build-macos:
    needs: [verify, check-release-metadata]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download restic binary
        run: npm run download-restic -- --current

      - name: Build Electron app
        run: npm run build -- --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-build
          path: |
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/beta*.yml
            release/alpha*.yml
          if-no-files-found: error

  # Upgrades the production database with the app's own migration runner (scripts/db-migrate.ts)
  # before anything is published, so nobody who updates is met by "database upgrade required".
  # Same plan, lock, transactions and checksums as the in-app upgrade. A migration must keep the
  # previous release working (database.mdc), since installs update over the following hours.
  # Without the PRODUCTION_DATABASE_URL secret (the Session pooler string, port 5432) the job
  # skips and an admin applies the upgrade in the app as before. A refused or failed upgrade
  # stops the release.
  migrate-db:
    needs: [verify, check-release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Checkout
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # --ignore-scripts: the runner needs pg and tsx, none of the desktop's install scripts, and
      # none of them should run on a machine holding the database password.
      - name: Install dependencies
        if: ${{ env.DATABASE_URL != '' }}
        run: npm ci --ignore-scripts

      - name: Apply pending migrations
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::PRODUCTION_DATABASE_URL is not set; an admin applies the upgrade in the app."
            exit 0
          fi
          # A prerelease tag (v5.3.0-beta.1) ships to testers, not to everyone: it must not move
          # the production database ahead of the release the rest of the organization runs.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "::notice::$GITHUB_REF_NAME is a prerelease; the production database is not upgraded."
            exit 0
          fi
          npx tsx scripts/db-migrate.ts

  build-api:
    needs: [verify, check-release-metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: bluerobotics/blueplm-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}

  release:
    needs: [build-windows, build-macos, build-api, migrate-db]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-build
          path: dist/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: macos-build
          path: dist/macos

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Detect prerelease
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      # check-release-metadata has already rejected a stable tag with no section, but the guard is
      # repeated here because this is the step that actually produces the body: it should not be
      # able to publish an empty release regardless of what ran before it. Prereleases are exempt
      # for the reason given in that job.
      #
      # It also has to survive a section that is too long. GitHub refuses a release body over
      # 125,000 characters with a 422, and this job runs after every build job has succeeded — so an
      # oversized section costs the whole release at the last step, with the installers already
      # built and nothing published. v4.0.0's section is 180,000 characters. Whole lines are kept up
      # to a budget below the limit and the remainder is replaced by a link to the file, which is
      # the only copy that was ever complete anyway.
      - name: Extract changelog for version
        id: changelog
        env:
          MAX_BODY: 120000
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          CHANGELOG=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$(printf '%s' "$CHANGELOG" | tr -d '[:space:]')" ] && [[ "$VERSION" != *-* ]]; then
            echo "::error::Refusing to publish ${VERSION} with an empty release body:" \
                 "CHANGELOG.md has no non-empty '## [${VERSION}]' section."
            exit 1
          fi
          if [ "${#CHANGELOG}" -gt "$MAX_BODY" ]; then
            # `next` rather than `exit`: exiting closes the pipe while printf is still writing, which
            # kills printf with SIGPIPE and fails the step under `pipefail`. This reads to the end.
            KEPT=$(printf '%s\n' "$CHANGELOG" | awk -v max="$MAX_BODY" \
              '{ if (full) next
                 if (kept + length($0) + 1 > max) { full = 1; next }
                 kept += length($0) + 1; print }')
            # Built with printf rather than as a multi-line string: every line of a `run: |` block
            # has to stay indented, and a literal markdown block written at column zero silently
            # leaves the block scalar — which is a YAML parse error, not a formatting problem.
            FOOTER=$(printf '\n\n---\n\n%s %s\n' \
              "**These notes are truncated here.** GitHub will not accept a release body over 125,000 characters, and the notes for ${VERSION} are longer than that." \
              "The complete set is in [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) at this tag.")
            CHANGELOG="${KEPT}${FOOTER}"
            echo "::warning::Release body truncated to ${MAX_BODY} characters to fit GitHub's" \
                 "125,000-character limit. The full notes are linked from the body."
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # A major release (X.0.0) can need the database upgraded before older clients may update to it
      # (5.0.0 renamed the schema), so it is published as a draft and released by hand after the
      # database upgrade. Every other release publishes at once.
      - name: Detect major release
        id: major
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [[ "${VERSION#v}" =~ ^[0-9]+\.0\.0$ ]]; then
            echo "IS_MAJOR=true" >> $GITHUB_OUTPUT
          else
            echo "IS_MAJOR=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: ${{ steps.major.outputs.IS_MAJOR }}
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
          files: |
            dist/windows/*
            dist/macos/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # BluePLM Web (blueplm.io) moves with releases, not with every push to main, so the browser app
  # only ever runs released code. It goes out after the release is published, so the sign-in
  # page's "Download the desktop app" button finds this release's installers. Same build as
  # `npm run deploy:web`: the renderer built for the browser, served by the Workers static-assets
  # service in web/wrangler.jsonc on the route blueplm.io/*. The repository variables carry the
  # public build values (Supabase URL, anon key, the org's API URL for connect-src).
  # A major release (X.0.0) is published as a draft and may need the database upgraded first
  # (5.0.0 renamed the schema), so its web build is deployed by hand (`npm run deploy:web`) in the
  # cutover window, after the database upgrade, instead of here.
  deploy-web:
    needs: [release]
    if: ${{ !endsWith(github.ref_name, '.0.0') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # --ignore-scripts: the web build needs none of the desktop's install scripts (electron,
      # native modules), and none of them should run on a machine holding the Cloudflare token.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build BluePLM Web
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          BLUEPLM_WEB_API_URLS: ${{ vars.BLUEPLM_WEB_API_URLS }}

      - name: Deploy to blueplm.io
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          command: deploy --config web/wrangler.jsonc
