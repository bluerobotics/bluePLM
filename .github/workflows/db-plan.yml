name: Check production database

# Run by hand: shows what the next release's migrate-db job would apply to the production
# database (scripts/db-migrate.ts --plan). Changes nothing; also proves the
# PRODUCTION_DATABASE_URL secret connects.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Plan pending migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: npx tsx scripts/db-migrate.ts --plan
